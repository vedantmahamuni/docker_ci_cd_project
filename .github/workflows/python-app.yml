name: Machine Learning CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test and Train ML Model
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train ML Model
        run: python train_model.py

      - name: Run Tests
        run: pytest -v

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t student-ml-api .

  deploy:
    name: Deploy Application to Render
    runs-on: ubuntu-latest
    needs: [test, docker]

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render Deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}

        run: |
          test -n "$RENDER_DEPLOY_HOOK"

          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 2 \
            --request POST \
            "$RENDER_DEPLOY_HOOK"
